<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Savory-X | Loading</title>
    <meta name="description" content="Welcome to Savory-X.">
    <link rel="preload" href="images/logo.png" as="image">

    <style>
        /* ---------- Design Tokens ---------- */
        :root {
            --bg: #faf9f7;
            /* Page background */
            --brown-700: #6b4423;
            /* Main brown for spinner */
            --brown-100: #efe6dc;
            /* Soft brown for spinner track */
        }

        /* ---------- Reset & Layout ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        /* ---------- Logo ---------- */
        .logo-container {
            width: clamp(120px, 30vw, 180px);
            /* Entrance animation for a sleek feel */
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            animation: fadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
        }

        .logo-container img {
            display: block;
            width: 100%;
            height: auto;
            /* Optional drop shadow to make it pop slightly off the white bg */
            filter: drop-shadow(0 4px 12px rgba(59, 42, 29, 0.08));
        }

        /* ---------- Spinner ---------- */
        .spinner-wrapper {
            margin-top: 2.5rem;
            opacity: 0;
            /* Appears slightly after the logo */
            animation: fadeIn 1s ease forwards 0.4s;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--brown-100);
            border-top-color: var(--brown-700);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ---------- Animations ---------- */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Respect user preferences */
        @media (prefers-reduced-motion: reduce) {

            .logo-container,
            .spinner-wrapper {
                animation: none;
                opacity: 1;
                transform: none;
            }

            .spinner {
                animation: spin 1.5s linear infinite;
                /* Keep it spinning but slower */
            }
        }
    </style>
</head>

<body>

    <div class="logo-container">
        <!-- Replace 'logo.png' with the exact file name of your image if it differs -->
        <img src="images/logo.png" alt="Savory-X Logo">
    </div>

    <div class="spinner-wrapper" aria-label="Loading" role="status">
        <div class="spinner"></div>
    </div>

    <script>
        // Wait for 4 seconds (4000ms) then redirect to the home page
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                window.location.href = 'home.html';
            }, 4000);
        });
    </script>
</body>

</html>
